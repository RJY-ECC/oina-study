<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>OINA Master Study App</title>
<style>
:root{color-scheme:light dark;--bg:#f1f5f9;--card:#fff;--ink:#1e293b;--mute:#64748b;--line:#e2e8f0;--soft:#e2e8f0;--brand:#2563eb;--head:#1e3a8a;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--amber:#fef3c7;--amberi:#92400e;--purp:#ede9fe;--purpi:#5b21b6;--o:#dc2626;--i:#2563eb;--n:#ca8a04;--a:#16a34a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#162033;--ink:#e5e9f0;--mute:#94a3b8;--line:#263349;--soft:#243047;--brand:#3b82f6;--head:#bfdbfe;--ok:#4ade80;--okbg:#14532d;--bad:#f87171;--badbg:#7f1d1d;--amber:#422006;--amberi:#fcd34d;--purp:#2e1065;--purpi:#c4b5fd;--o:#f87171;--i:#60a5fa;--n:#facc15;--a:#4ade80}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1220;--card:#162033;--ink:#e5e9f0;--mute:#94a3b8;--line:#263349;--soft:#243047;--brand:#3b82f6;--head:#bfdbfe;--ok:#4ade80;--okbg:#14532d;--bad:#f87171;--badbg:#7f1d1d;--amber:#422006;--amberi:#fcd34d;--purp:#2e1065;--purpi:#c4b5fd;--o:#f87171;--i:#60a5fa;--n:#facc15;--a:#4ade80}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:30rem;min-height:100dvh;margin:0 auto;padding:1rem;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;gap:.9rem}
button{font:inherit;color:inherit;border:0;cursor:pointer;border-radius:.9rem;transition:transform .08s,background .15s,opacity .15s}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hero{text-align:center;margin:1rem 0 .5rem}
.hero[hidden]{display:none}
.logo{width:min(16rem,70%);height:auto;background:#fff;border-radius:1.25rem;padding:.5rem;box-shadow:0 1px 3px #0002;-webkit-user-drag:none;pointer-events:none}
h1{margin:.8rem 0 0;font-size:1.9rem;font-weight:800;color:var(--head);letter-spacing:-.02em}
.sub{margin:.1rem 0 0;color:var(--mute);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:1.25rem;padding:1rem;box-shadow:0 1px 2px #0001}
.label{margin:0 0 .6rem;text-align:center;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.seg,.chips{display:flex;gap:.35rem;background:var(--soft);padding:.3rem;border-radius:.9rem}
.seg button,.chips button{flex:1;padding:.6rem .2rem;background:none;font-size:.78rem;font-weight:700;color:var(--mute)}
.seg button.on,.chips button.on{background:var(--card);color:var(--brand);box-shadow:0 1px 3px #0003}
.count{margin:.7rem 0 0;text-align:center;font-size:.85rem;color:var(--mute);font-weight:500}
.big{padding:1.15rem;font-size:1.2rem;font-weight:700;color:#fff;box-shadow:0 6px 14px -6px #0006}
.blue{background:#2563eb}.green{background:#059669}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--mute);padding:.5rem .25rem}
.tbtn{background:var(--soft);color:var(--ink);font-weight:700;font-size:.8rem;padding:.5rem .9rem;border-radius:99px}
.notes{margin-top:.9rem;padding:.7rem .8rem;background:var(--amber);color:var(--amberi);border-radius:.8rem;font-size:.82rem}
.notes p{margin:.3rem 0}.notes .nl{font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.68rem;margin:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-top:.5rem}
.back{background:none;color:var(--brand);font-weight:700;padding:.5rem .25rem}
.pill{background:var(--soft);padding:.3rem .8rem;border-radius:99px;font-size:.85rem;font-weight:700}
.prog{height:.4rem;background:var(--soft);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .25s}
.fc{flex:1;min-height:21rem;background:var(--card);border:1px solid var(--line);border-radius:1.75rem;box-shadow:0 10px 25px -12px #0004;padding:1.5rem;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;cursor:pointer;animation:pop .18s ease-out}
@keyframes pop{from{opacity:.4;transform:scale(.97)}to{opacity:1;transform:none}}
.fc h2{margin:0;font-size:1.9rem;font-weight:800;text-align:center}
.fc h3{margin:0 0 .6rem;padding-bottom:.5rem;border-bottom:1px solid var(--line);text-align:center;font-size:1.2rem;color:var(--head)}
.back-face{width:100%;max-height:26rem;overflow-y:auto;text-align:left}
.fact{margin:.55rem 0;font-size:.95rem}
.fact b{font-weight:800}
.hint{position:absolute;bottom:.7rem;font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);opacity:.8}
.row{display:flex;gap:.7rem}
.row button{flex:1;padding:.85rem;font-weight:700}
.amber{background:var(--amber);color:var(--amberi)}.purple{background:var(--purp);color:var(--purpi)}.red{background:var(--badbg);color:var(--bad)}.gray{background:var(--soft)}.prime{background:var(--brand);color:#fff}
.q{border-top:4px solid var(--brand)}
.q p{margin:0;color:var(--mute);font-size:.85rem}.q b{color:var(--brand);text-transform:uppercase;letter-spacing:.05em}
.q h2{margin:.4rem 0 0;font-size:1.5rem;font-weight:800;line-height:1.2}
.tag{display:inline-block;margin-top:.5rem;font-size:.7rem;font-weight:700;color:var(--mute);background:var(--soft);border-radius:99px;padding:.1rem .6rem}
.opts{display:flex;flex-direction:column;gap:.6rem}
.opt{display:flex;gap:.7rem;text-align:left;padding:.9rem;background:var(--card);border:2px solid var(--line);font-size:.9rem;font-weight:500;line-height:1.4}
.opt kbd{flex:none;width:1.5rem;height:1.5rem;border-radius:.4rem;background:var(--soft);font:700 .75rem/1.5rem inherit;text-align:center;color:var(--mute)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.no{background:var(--badbg);border-color:var(--bad);opacity:.8}
.msg{margin:0;text-align:center;font-weight:700}
.msg.ok{color:var(--ok)}.msg.no{color:var(--bad)}
.empty{text-align:center;padding:2rem 1rem}.empty h2{margin:0;font-size:1.5rem}.empty p{color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom));transform:translate(-50%,2rem);background:#0f172a;color:#fff;padding:.6rem 1.1rem;border-radius:99px;font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:.2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(hover:hover){.big:hover{filter:brightness(1.08)}.opt:hover:not(.ok):not(.no){border-color:var(--brand)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

{ day: 2, name: "Pectoralis Minor", o: "Third, fourth and fifth ribs", i: "Medial surface of coracoid process of the scapula", n: "Medial pectoral, with fibers from communicating branch of lateral pectoral C(6), <b>7, 8</b>, T1", a: "Depress, abduct, and downwardly rotate the scapula. Assist to elevate thorax.", notes: ["Nerve = Medial Pectoral Nerve, Lateral Pectoral Nerve, LPN (C5-T7)"] },
{ day: 2, name: "Pectoralis Major", o: "Medial half of clavicle, sternum and cartilage of first through sixth ribs", i: "Crest of greater tubercle of humerus", n: "Upper fibers: Lateral pectoral C<b>5, 6, 7</b>. Lower fibers: Lateral/medial pectoral C<b>6, 7, 8</b>, <b>T1</b>", a: "Adduct & medially rotate shoulder. Upper fibers flex & horiz. adduct. Lower fibers extend.", notes: ["Nerve = Lateral Pectoral Nerve, LPN (C5-C7) and Medial Pectoral Nerve, MPN (C8-T1)"] },
{ day: 2, name: "Levator Scapula", o: "Transverse processes of first through fourth cervical vertebrae", i: "Medial border of scapula, between superior angle and superior portion of spine of scapula", n: "Cervical <b>3, 4</b>, and Dorsal scapular C4, <b>5</b>", a: "Unilaterally: Elevate & downwardly rotate scapula, laterally flex/rotate head & neck. Bilaterally: Extend head/neck.", notes: ["Origin = Transverse Process of C1-C4", "Nerve = (Cervical 3,4 = Part of Cervical Plexus) and DSN (C4-C5)"] },
{ day: 2, name: "Trapezius", o: "External occipital protuberance, medial superior nuchal line, ligamentum nuchae and spinous processes C-7 to T-12", i: "Lateral one-third of clavicle, acromion and spine of the scapula", n: "Spinal portion of cranial nerve XI (accessory) and ventral ramus C2, <b>3, 4</b>", a: "Upper: Extend, lat flex, rotate head; Elevate/upwardly rotate scapula. Middle: Adduct/stabilize scapula. Lower: Depress/upwardly rotate scapula.", notes: ["Nerve = Cranial Nerve 11 (Accessory) for Motor and Ventral Ramus C2-C4 for Sensory"] },
{ day: 2, name: "Rhomboid Major", o: "Spinous processes of T-2 to T-5", i: "Medial border of the scapula between the spine of the scapula and inferior angle", n: "Dorsal scapular C4, <b>5</b>", a: "Adduct, elevate, and downwardly rotate the scapula (S/T joint)" },
{ day: 2, name: "Rhomboid Minor", o: "Spinous processes of C-7 and T-1", i: "Upper portion of medial border of the scapula, at the level of the spine of the scapula", n: "Dorsal scapular C4, <b>5</b>", a: "Adduct, elevate, and downwardly rotate the scapula (S/T joint)" },
{ day: 2, name: "Deltoid", o: "Lateral one-third of clavicle, acromion and spine of scapula", i: "Deltoid tuberosity", n: "Axillary C<b>5, 6</b>", a: "All: Abduct shoulder. Anterior: Flex, medially rotate, horiz adduct. Posterior: Extend, laterally rotate, horiz abduct." }
];

const $ = s => document.querySelector(s), app = $('#app'), hero = $('#hero');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let saved = store.get('oina_saved', []), best = store.get('oina_best', 0);
const root = document.documentElement, mq = matchMedia('(prefers-color-scheme: dark)');
const theme = store.get('oina_theme', null);
if (theme) root.dataset.theme = theme;
const isDark = () => (root.dataset.theme || (mq.matches ? 'dark' : 'light')) === 'dark';
const PROPS = { o: 'Origin', i: 'Insertion', n: 'Nerve', a: 'Action' };
const S = { mode: 'menu', filter: store.get('oina_filter', 'all'), focus: 'any', deck: [], i: 0, flip: false, score: 0, total: 0, streak: 0, q: null, bag: [] };

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function active() {
  if (S.filter === 'saved') return muscles.filter(m => saved.includes(m.name));
  if (S.filter === 'all') return muscles;
  return muscles.filter(m => m.day === +S.filter);
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1400);
}
function render() {
  hero.hidden = S.mode !== 'menu';
  ({ menu: menuView, cards: cardsView, quiz: quizView })[S.mode]();
}

/* ---------- Menu ---------- */
function menuView() {
  const n = active().length, f = S.filter, dis = n ? '' : ' disabled';
  const seg = (v, l) => `<button data-act="filter" data-v="${v}" class="${f === v ? 'on' : ''}" aria-pressed="${f === v}">${l}</button>`;
  const chip = (v, l) => `<button data-act="focus" data-v="${v}" class="${S.focus === v ? 'on' : ''}" aria-pressed="${S.focus === v}">${l}</button>`;
  app.innerHTML = `
    <section class="card">
      <p class="label">Study set</p>
      <div class="seg">${seg('1', 'Day 1')}${seg('2', 'Day 2')}${seg('all', 'All')}${seg('saved', '⭐ Saved (' + saved.length + ')')}</div>
      <p class="count">${n} muscle${n === 1 ? '' : 's'} selected${f === 'saved' && !n ? ' — save cards from the flashcards first' : ''}</p>
    </section>
    <button class="big blue" data-act="cards"${dis}>📚 Flashcards</button>
    <section class="card">
      <p class="label">Quiz focus</p>
      <div class="chips">${chip('any', 'Mixed')}${chip('o', 'Origin')}${chip('i', 'Insertion')}${chip('n', 'Nerve')}${chip('a', 'Action')}</div>
    </section>
    <button class="big green" data-act="quiz"${dis}>📝 Practice Quiz</button>
    <div class="foot"><span>🔥 Best streak: <b>${best}</b></span><button class="tbtn" data-act="theme">${isDark() ? '☀️ Light mode' : '🌙 Dark mode'}</button></div>`;
}

/* ---------- Flashcards ---------- */
function cardsView() {
  const d = S.deck, inSaved = S.filter === 'saved';
  if (!d.length) {
    app.innerHTML = `<div class="bar"><button class="back" data-act="menu">← Menu</button></div>
      <div class="card empty"><h2>Deck empty 🎉</h2><p>No cards left in this deck.</p>
      <button class="prime" style="width:100%;padding:1rem;font-weight:700" data-act="cards">Restart deck</button></div>`;
    return;
  }
  const m = d[S.i], fact = (k, c, t) => `<p class="fact"><b style="color:var(--${c})">${k}:</b> ${t}</p>`;
  app.innerHTML = `
    <div class="bar"><button class="back" data-act="menu">← Menu</button>
      <span class="pill">${inSaved ? '⭐ ' : ''}${S.i + 1} / ${d.length}</span></div>
    <div class="prog" role="progressbar" aria-valuemin="1" aria-valuemax="${d.length}" aria-valuenow="${S.i + 1}"><i style="width:${(S.i + 1) / d.length * 100}%"></i></div>
    <div class="fc" data-act="flip" role="button" tabindex="0" aria-label="Flip card">
      ${S.flip
        ? `<div class="back-face"><h3>${m.name}</h3>${fact('O', 'o', m.o)}${fact('I', 'i', m.i)}${fact('N', 'n', m.n)}${fact('A', 'a', m.a)}${m.notes ? `<div class="notes"><p class="nl">Side notes</p>${m.notes.map(n => `<p>${n}</p>`).join('')}</div>` : ''}</div>`
        : `<h2>${m.name}</h2>`}
      <span class="hint">Tap to flip · swipe for next</span>
    </div>
    <div class="row">
      <button class="purple" data-act="shuffle">🔀 Scramble</button>
      <button class="${inSaved ? 'red' : 'amber'}" data-act="save">${inSaved ? '🗑 Remove' : '⭐ Save'}</button>
    </div>
    <div class="row">
      <button class="gray" data-act="prev"${S.i ? '' : ' disabled'}>Prev</button>
      <button class="prime" data-act="next"${S.i < d.length - 1 ? '' : ' disabled'}>Next</button>
    </div>`;
}

/* ---------- Quiz ---------- */
function newQ() {
  if (!S.bag.length) {
    S.bag = shuffle(active().slice());
    const l = S.bag.length - 1;
    if (S.q && l > 0 && S.bag[l].name === S.q.muscle) [S.bag[0], S.bag[l]] = [S.bag[l], S.bag[0]];
  }
  const t = S.bag.pop();
  const p = S.focus === 'any' ? Object.keys(PROPS)[Math.floor(Math.random() * 4)] : S.focus;
  const pool = [...new Set(muscles.map(m => m[p]))].filter(x => x !== t[p]);
  const opts = shuffle([t[p], ...shuffle(pool).slice(0, 3)]);
  S.q = { muscle: t.name, day: t.day, prop: PROPS[p], answer: t[p], opts, wrong: [], solved: false, counted: false };
}
function answer(i) {
  const q = S.q;
  if (!q || q.solved || q.wrong.includes(i) || i < 0 || i >= q.opts.length) return;
  const ok = q.opts[i] === q.answer;
  if (!q.counted) {
    q.counted = true; S.total++;
    if (ok) { S.score++; S.streak++; if (S.streak > best) { best = S.streak; store.set('oina_best', best); } }
    else S.streak = 0;
  }
  if (ok) q.solved = true; else q.wrong.push(i);
  render();
}
function quizView() {
  const q = S.q, pct = S.total ? Math.round(S.score / S.total * 100) : 0;
  const state = i => q.solved && q.opts[i] === q.answer ? ' ok' : q.wrong.includes(i) ? ' no' : '';
  const mark = i => state(i) === ' ok' ? '✅ ' : state(i) === ' no' ? '❌ ' : '';
  app.innerHTML = `
    <div class="bar"><button class="back" data-act="menu">← Menu</button>
      <span class="pill">First try: ${S.score}/${S.total}${S.total ? ' · ' + pct + '%' : ''}${S.streak > 1 ? ' · 🔥' + S.streak : ''}</span></div>
    <section class="card q">
      <p>What is the <b>${q.prop}</b> of the:</p>
      <h2>${q.muscle}?</h2><span class="tag">Day ${q.day}</span>
    </section>
    <div class="opts">${q.opts.map((o, i) => `<button class="opt${state(i)}" data-act="answer" data-v="${i}"${q.solved ? ' disabled style="opacity:1"' : ''}><kbd>${i + 1}</kbd><span>${mark(i)}${o}</span></button>`).join('')}</div>
    <p class="msg ${q.solved ? 'ok' : 'no'}" aria-live="polite">${q.solved ? 'SD silently nods in approval' : q.wrong.length ? 'SD scoffs in disgust' : ''}</p>
    <button class="big ${q.solved ? 'blue' : 'gray'}" style="font-size:1rem;${q.solved ? '' : 'color:inherit;box-shadow:none'}" data-act="nextq">Next →</button>`;
}

/* ---------- Actions ---------- */
const act = {
  filter: v => { S.filter = v; store.set('oina_filter', v); render(); },
  focus: v => { S.focus = v; render(); },
  menu: () => { S.mode = 'menu'; render(); scrollTo(0, 0); },
  cards: () => { S.mode = 'cards'; S.deck = active().slice(); S.i = 0; S.flip = false; render(); },
  flip: () => { S.flip = !S.flip; render(); },
  prev: () => { if (S.i > 0) { S.i--; S.flip = false; render(); } },
  next: () => { if (S.i < S.deck.length - 1) { S.i++; S.flip = false; render(); } },
  shuffle: () => { shuffle(S.deck); S.i = 0; S.flip = false; render(); toast('Deck scrambled'); },
  save: () => {
    const m = S.deck[S.i];
    if (S.filter === 'saved') { saved = saved.filter(n => n !== m.name); toast('Removed from pile'); }
    else { if (!saved.includes(m.name)) saved.push(m.name); toast('Saved to pile ⭐'); }
    store.set('oina_saved', saved);
    S.deck.splice(S.i, 1);
    S.i = Math.min(S.i, Math.max(0, S.deck.length - 1)); S.flip = false; render();
  },
  quiz: () => { S.mode = 'quiz'; S.score = S.total = S.streak = 0; S.bag = []; S.q = null; newQ(); render(); },
  answer: v => answer(+v),
  nextq: () => { newQ(); render(); scrollTo(0, 0); },
  theme: () => { const t = isDark() ? 'light' : 'dark'; root.dataset.theme = t; store.set('oina_theme', t); render(); }
};

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled) act[b.dataset.act](b.dataset.v);
});

/* Swipe on flashcards */
let tx = null;
app.addEventListener('touchstart', e => { tx = e.target.closest('.fc') ? e.touches[0].clientX : null; }, { passive: true });
app.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) dx < 0 ? act.next() : act.prev();
});

/* Keyboard: ←/→ flip through, Space flips, S saves, 1–4 answer, Enter next, Esc menu */
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'Escape' && S.mode !== 'menu') return act.menu();
  if (e.target.tagName === 'BUTTON' && (k === ' ' || k === 'Enter')) return;
  if (S.mode === 'cards' && S.deck.length) {
    if (k === 'ArrowRight') act.next();
    else if (k === 'ArrowLeft') act.prev();
    else if (k === ' ' || k === 'Enter') { e.preventDefault(); act.flip(); }
    else if (k === 's' || k === 'S') act.save();
  } else if (S.mode === 'quiz') {
    if (k >= '1' && k <= '4') answer(+k - 1);
    else if (k === 'Enter' || k === 'ArrowRight') act.nextq();
  }
});

render();
</script>
</body>
</html>
